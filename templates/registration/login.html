{% extends 'social/base.html' %}
{% block content %}
<div class="max-w-md mx-auto card p-8 animate-fade-in-up">
    <h2 class="text-2xl font-bold text-center flex items-center justify-center gap-2"><i class="fas fa-lock"></i> Iniciar sessão</h2>
    <form id="loginForm" method="post" action="#">
        {% csrf_token %}
        <div class="mt-4">
            <i class="fas fa-envelope absolute mt-3 ml-3 text-gray-400"></i>
            <input type="email" id="email" name="email" placeholder="E-mail" class="w-full p-2 pl-10 border rounded-lg">
        </div>
        <div class="mt-2">
            <i class="fas fa-key absolute mt-3 ml-3 text-gray-400"></i>
            <input type="password" id="password" name="password" placeholder="Palavra-passe" class="w-full p-2 pl-10 border rounded-lg">
        </div>
        <button type="button" id="loginBtn" class="mt-4 w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition flex items-center justify-center gap-2">
            <i class="fas fa-sign-in-alt"></i> Entrar
        </button>
    </form>
    <div id="errorMsg" class="text-center text-red-600 mt-4 bg-red-50 p-2 rounded-lg hidden">
        <i class="fas fa-exclamation-circle"></i> Não foi possível encontrar o utilizador.
    </div>
    <div class="mt-6 text-center border-t pt-4">
        <p class="text-gray-600">É a sua primeira vez aqui?</p>
        <button id="firstTimeBtn" class="mt-2 bg-gray-200 text-gray-800 px-6 py-2 rounded-full hover:bg-gray-300 transition">
            Sim
        </button>
        <div id="serverFullMsg" class="text-center text-orange-600 mt-4 bg-orange-50 p-2 rounded-lg hidden">
            <i class="fas fa-database"></i> Neste momento o servidor está cheio e não é possível aceitar mais utilizadores.
        </div>
    </div>
</div>
<script>
    document.getElementById('loginBtn').addEventListener('click', function() {
        document.getElementById('errorMsg').classList.remove('hidden');
    });
    document.getElementById('firstTimeBtn').addEventListener('click', function() {
        document.getElementById('serverFullMsg').classList.remove('hidden');
    });
</script>
{% endblock %}
