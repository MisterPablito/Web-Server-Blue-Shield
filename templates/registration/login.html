{% extends 'social/base.html' %}
{% block content %}
<div class="max-w-md mx-auto card p-8">
    <h2 class="text-2xl font-bold text-center">🔐 Login</h2>
    <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Utilizador" class="w-full p-2 border rounded mt-4">
        <input type="password" name="password" placeholder="Palavra-passe" class="w-full p-2 border rounded mt-2">
        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded mt-4">Entrar</button>
    </form>
    <p class="text-center text-red-600 mt-4">⚠️ Utilizador não encontrado.</p>
    <p class="text-center mt-2"><a href="{% url 'register_error' %}" class="text-blue-600">Criar conta</a></p>
</div>
{% endblock %}
