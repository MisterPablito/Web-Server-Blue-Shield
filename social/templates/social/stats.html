{% extends 'social/base.html' %}
{% block title %}Estatísticas{% endblock %}
{% block content %}
<h1 class="text-3xl font-bold text-gray-800 mb-8 border-l-4 border-blue-600 pl-4">📊 Estatísticas de Segurança</h1>
<div class="grid md:grid-cols-2 gap-8">
    <div>
        <canvas id="riskChart" width="400" height="400"></canvas>
    </div>
    <div class="space-y-4">
        <div class="card p-6 text-center">
            <div class="text-5xl font-bold text-blue-600">{{ total }}</div>
            <p class="text-gray-600 mt-2">Total de ameaças</p>
        </div>
        <div class="card p-6 text-center">
            <div class="text-5xl font-bold text-red-600">{{ alto }}</div>
            <p class="text-gray-600 mt-2">Ameaças de <strong>Risco Alto</strong></p>
        </div>
        <div class="card p-6 text-center">
            <div class="text-5xl font-bold text-yellow-600">{{ medio }}</div>
            <p class="text-gray-600 mt-2">Ameaças de <strong>Risco Médio</strong></p>
        </div>
        <div class="card p-6 text-center">
            <div class="text-5xl font-bold text-green-600">{{ baixo }}</div>
            <p class="text-gray-600 mt-2">Ameaças de <strong>Risco Baixo</strong></p>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const ctx = document.getElementById('riskChart').getContext('2d');
    new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: ['Alto', 'Médio', 'Baixo'],
            datasets: [{
                data: [{{ alto }}, {{ medio }}, {{ baixo }}],
                backgroundColor: ['#ef4444', '#f59e0b', '#10b981'],
                borderWidth: 0
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { position: 'bottom' },
                title: { display: true, text: 'Distribuição por Nível de Risco' }
            }
        }
    });
</script>
{% endblock %}
