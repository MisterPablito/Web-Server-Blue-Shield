<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlueShield | {% block title %}Portal de Segurança{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f4f7fc; }
        .card { background: white; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); transition: transform 0.2s; }
        .card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .risk-high { background-color: #fee2e2; color: #b91c1c; }
        .risk-medium { background-color: #ffedd5; color: #b45309; }
        .risk-low { background-color: #dcfce7; color: #15803d; }
        .badge { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
        .nav-active { border-bottom: 2px solid white; }
    </style>
</head>
<body>
    <nav class="bg-blue-800 text-white shadow-md">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="/" class="text-xl font-bold">🔵 BlueShield</a>
            <div class="space-x-6">
                <a href="/" class="hover:text-blue-200 transition {% if request.path == '/' %}nav-active{% endif %}">Vulnerabilidades</a>
                <a href="/stats" class="hover:text-blue-200 transition {% if request.path == '/stats' %}nav-active{% endif %}">Estatísticas</a>
            </div>
        </div>
    </nav>
    <main class="container mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>
    <footer class="text-center text-gray-500 text-sm py-6 border-t mt-8">
        © 2026 BlueShield • Projeto académico de cibersegurança
    </footer>
</body>
</html>
